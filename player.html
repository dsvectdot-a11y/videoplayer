<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

#player{
    width:100%;
    height:100%;
}

video,
iframe{
    width:100%;
    height:100%;
    border:none;
    object-fit:contain;
    background:#000;
}

#backBtn{
    position:fixed;
    top:15px;
    left:15px;
    z-index:1000;
    padding:10px 15px;
    background:#ff0000;
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

#backBtn:hover{
    background:#cc0000;
}
</style>

</head>
<body>

<button id="backBtn" onclick="location.href='index.html'">
⬅ Back
</button>

<div id="player"></div>

<script>

const url = localStorage.getItem("videoURL");
const player = document.getElementById("player");

if(!url){
    player.innerHTML = `
        <div style="
        color:white;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100%;
        font-size:24px;">
        No video selected.
        </div>`;
}

else if(url.includes("youtube.com") || url.includes("youtu.be")){

    let id="";

    if(url.includes("watch?v=")){
        id=url.split("watch?v=")[1].split("&")[0];
    }else{
        id=url.split("youtu.be/")[1].split("?")[0];
    }

    player.innerHTML=`
    <iframe
        src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0"
        allow="autoplay; fullscreen"
        allowfullscreen>
    </iframe>
    `;
}

else{

    player.innerHTML=`
    <video controls autoplay playsinline>
        <source src="${url}">
        Your browser does not support HTML5 video.
    </video>
    `;
}

// Try fullscreen (works after user interaction in many browsers)
document.addEventListener("click",function(){

    if(!document.fullscreenElement){
        document.documentElement.requestFullscreen().catch(()=>{});
    }

},{once:true});

</script>

</body>
</html>
