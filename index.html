<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player Admin</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#111;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:90%;
    max-width:450px;
    background:#1b1b1b;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,.5);
}

h1{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:15px;
    font-size:16px;
    border:none;
    border-radius:8px;
    margin-bottom:15px;
    outline:none;
}

button{
    width:100%;
    padding:15px;
    background:#ff0000;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#d90000;
}

.info{
    margin-top:20px;
    color:#ccc;
    font-size:14px;
    line-height:1.6;
}

.example{
    background:#000;
    padding:10px;
    border-radius:8px;
    margin-top:10px;
    word-break:break-all;
    font-size:13px;
}
</style>

</head>
<body>

<div class="container">

<h1>🎬 Video Player</h1>

<input
id="videoUrl"
type="text"
placeholder="Paste YouTube or MP4 URL">

<button onclick="saveVideo()">
▶ Open Player
</button>

<div class="info">

<b>Supported:</b>

<div class="example">
https://youtu.be/VIDEO_ID
</div>

<div class="example">
https://www.youtube.com/watch?v=VIDEO_ID
</div>

<div class="example">
https://example.com/movie.mp4
</div>

<div class="example">
https://example.com/video.webm
</div>

</div>

</div>

<script>

function saveVideo(){

let url=document.getElementById("videoUrl").value.trim();

if(url==""){
alert("Please enter a video URL.");
return;
}

localStorage.setItem("videoURL",url);

window.location.href="player.html";

}

</script>

</body>
</html>
